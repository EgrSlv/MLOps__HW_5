stages:
  prepare:
    cmd: python ./prepare.py
    deps:
    - ./prepare.py
    - data/titanic.csv
    params:
    - prepare.random_state
    - prepare.test_size
    outs:
    - data/processed
  train:
    cmd: python ./train.py
    deps:
    - ./train.py
    - data/processed
    params:
    - train.max_iter
    - train.model
    - train.random_state
    outs:
    - model.pkl
